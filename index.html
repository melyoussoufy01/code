<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-size:23px}.tabs,.actions,.subtabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d1d5db;background:#fff;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer;color:#111827}.btn.on,.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.soft{background:#f3f4f6}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:17px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.muted{color:#6b7280}.small{font-size:12px}.metric b{font-size:20px}.listing{display:grid;grid-template-columns:1.18fr .82fr;gap:14px}.title{display:flex;justify-content:space-between;gap:12px}.price{font-size:27px;font-weight:900}.good{color:#047857}.mid{color:#b45309}.bad{color:#b91c1c}.why,.nego,.learn{border-radius:14px;padding:14px}.why{background:#f9fafb;border:1px solid #e5e7eb}.nego{background:#111827;color:#fff}.learn{background:#eff6ff;border:1px solid #bfdbfe}.line{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.short{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #e5e7eb}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;background:#ecfdf5;color:#065f46;font-size:12px;font-weight:800}.warn{background:#fffbeb;color:#92400e}.empty{padding:38px;text-align:center}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{padding:5px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.chip.green{background:#ecfdf5;color:#065f46}.chip.orange{background:#fffbeb;color:#92400e}.chip.red{background:#fef2f2;color:#991b1b}.section-title{margin:4px 0 10px;font-size:16px}.rule{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f3f4f6}.rule:last-child{border-bottom:0}.rule strong{display:block}.count{font-size:12px;color:#6b7280}.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:#111827}.info{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid #9ca3af;color:#4b5563;font-size:11px;font-weight:900;cursor:help;position:relative;margin-left:4px}.info .tiptext{visibility:hidden;opacity:0;transition:.15s;position:absolute;z-index:20;left:50%;top:25px;transform:translateX(-50%);width:280px;background:#111827;color:white;padding:10px 11px;border-radius:10px;font-weight:500;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.2)}.info:hover .tiptext,.info:focus .tiptext{visibility:visible;opacity:1}.kpi-label{display:flex;align-items:center;font-size:12px;color:#6b7280}.source{font-size:11px;color:#6b7280}.done{opacity:.65}.error{max-width:760px;margin:40px auto;padding:18px;border-radius:14px;background:#fff;border:1px solid #fecaca;color:#991b1b}
@media(max-width:800px){.listing,.g4,.g3,.g2{grid-template-columns:1fr}.top,.title{align-items:flex-start;flex-direction:column}.app{padding:12px}.info .tiptext{left:0;transform:none;width:230px}}
</style>

<body>
<div id="app"><div class="app"><div class="card">Chargement de Houser…</div></div></div>
<script>
(function(){
'use strict';
const listings=[
{id:'H005',city:'Strasbourg',area:'Hautepierre Centre',type:'T2',price:124900,sqm:52,dpe:'C',charges:1955,tax:900,rent:700,market:2268,free:true,copro:'clean',works:0,mourabaha:'ok',notes:['Libre','Tram à ~350 m','Ravalement/isolation 2020','Cuisine + salle d’eau déjà rénovées'],source:'https://www.superimmo.com/achat/appartement/alsace/bas-rhin/strasbourg-67/strasbourg-67200/pieces-2-2',rentExplain:'Loyer prudent retenu à 700 € HC. MeilleursAgents estime Hautepierre à ~14,2 €/m²/mois, soit ~738 € pour 52 m². Houser arrondit volontairement vers le bas.',marketExplain:'Valeur marché utilisée : ~2 268 €/m², estimation MeilleursAgents Hautepierre au 1er septembre 2026.',freeEvidence:'Annonce : « Appartement T2 de 52 m² LIBRE ».',chargeExplain:'1 955 €/an, soit ~163 €/mois. Chauffage et eau chaude sont inclus : au stade Creuser, il faut obtenir la part récupérable locataire.'},
{id:'H002',city:'Lingolsheim',area:'Écoquartier',type:'T2',price:134900,sqm:45.41,dpe:'B',charges:1058,tax:741,rent:604,market:2410,free:true,copro:'clean',works:0,mourabaha:'ok',notes:['DPE B','Immeuble récent','2 stationnements','Charges contenues'],source:'https://www.squarehabitat.fr/annonces/achat/bien/appartement/immobilier/grand-est/bas-rhin-67',rentExplain:'Loyer prudent estimé à partir du marché local et des comparables T2. Houser n’utilise jamais le loyer “idéal” du vendeur.',marketExplain:'Valeur locale utilisée : ~2 410 €/m² pour le screening. À confirmer par quartier précis avant offre.',freeEvidence:'Bien traité comme disponible dans le screening initial ; confirmation écrite exigée avant visite.',chargeExplain:'~1 058 €/an, soit ~88 €/mois : niveau plutôt sain pour 45 m².'},
{id:'H001',city:'Hœnheim',area:'Rue Aristide Briand',type:'T2',price:130000,sqm:51.37,dpe:'D',charges:2400,tax:500,rent:708,market:2255,free:true,copro:'unknown',works:0,mourabaha:'ok',notes:['Libre immédiatement','51 m²','Balcon/loggia','Cave'],source:'https://www.orpi.com/annonce-vente-appartement-t2-hoenheim-67800-b818dd71-9d0e-4553-9896-b4ede0a819df/',rentExplain:'Loyer prudent retenu à 708 € HC après comparaison surface/secteur. On préfère sous-estimer le loyer plutôt que fabriquer du rendement.',marketExplain:'Référence de marché locale utilisée : ~2 255 €/m². Elle sera resserrée à la rue et aux ventes comparables si tu cliques Creuser.',freeEvidence:'Annonce Orpi : disponible immédiatement.',chargeExplain:'2 400 €/an, soit 200 €/mois : élevé. Houser pénalise fortement ce niveau tant que la part récupérable n’est pas connue.'},
{id:'H011',city:'Strasbourg',area:'Meinau – prox. tram Avenue de Colmar',type:'T2',price:150000,sqm:42.08,dpe:'C',charges:1084.68,tax:800,rent:620,market:2934,free:true,copro:'clean',works:0,mourabaha:'ok',notes:['Première occupation','DPE C','Terrasse + jardin','Pas de procédure copro'],source:'https://www.seloger.com/annonce/achat/grand-est/bas-rhin-67/strasbourg-67000/26I31IX8W9SY',rentExplain:'Loyer prudent ~620 € HC. Le marché moyen du secteur est supérieur, mais Houser réduit l’estimation pour tenir compte du RDC et éviter un scénario trop optimiste.',marketExplain:'Référence secteur Canardière/Meinau : ~2 934 €/m². Le bien est affiché bien au-dessus : le score le reflète.',freeEvidence:'Annonce : « Première occupation ».',chargeExplain:'1 084,68 €/an, soit ~90 €/mois : correct.'},
{id:'H004',city:'Bischheim',area:'Centre',type:'T2',price:129000,sqm:38,dpe:'C',charges:850,tax:700,rent:516,market:2551,free:true,copro:'clean',works:0,mourabaha:'ok',notes:['Petite copropriété','Terrasse','Bon état','Charges faibles'],source:'https://www.hebdingimmobilier.fr/vente/10-bischheim/appartement/t2/2146-appartement-2-pieces-avec-terrasse-et-parking-immeuble-moderne-de-standing/',rentExplain:'Loyer prudent basé sur la petite surface et le marché local. Le rendement reste faible malgré les charges maîtrisées.',marketExplain:'Valeur screening ~2 551 €/m². Le prix affiché est sensiblement supérieur au marché retenu.',freeEvidence:'Libre retenu dans le screening initial ; à confirmer dans le dossier vendeur.',chargeExplain:'850 €/an, soit ~71 €/mois : très bon niveau.'},
{id:'H003',city:'Ostwald',area:'Rives du Bohrie',type:'T2',price:158000,sqm:48,dpe:'C',charges:1743,tax:750,rent:670,market:2662,free:true,copro:'clean',works:0,mourabaha:'ok',notes:['Résidence 2020','Tram','Terrasse','Parking'],source:'https://www.seloger.com/annonces/achat/appartement/ostwald-67/est/273869061.htm',rentExplain:'Loyer prudent construit à partir du secteur et de la surface ; le problème ici n’est pas le loyer mais le prix d’achat.',marketExplain:'Référence locale ~2 662 €/m² utilisée pour le screening.',freeEvidence:'Bien présenté disponible dans l’annonce ; confirmation exigée avant visite.',chargeExplain:'1 743 €/an, soit ~145 €/mois : acceptable mais pas léger.'},
{id:'H012',city:'Strasbourg',area:'Petite France',type:'F1',price:150000,sqm:25.6,dpe:'D',charges:900,tax:729,rent:650,market:4886,free:true,copro:'clean',works:0,mourabaha:'ok',notes:['Libre de toute occupation','Dernier étage','Centre historique','Ascenseur'],source:'https://www.seloger.com/annonce/achat/grand-est/bas-rhin-67/strasbourg-67000/264LXFSIY7IL',rentExplain:'Loyer prudent autour de 650 € HC pour 25,6 m² Carrez dans un emplacement premium. À vérifier strictement avec l’encadrement/les références applicables.',marketExplain:'Petite France est un secteur patrimonial très cher (~4 886 €/m² moyen). Le prix reste élevé par rapport au rendement recherché.',freeEvidence:'Annonce : « vendu libre de toute occupation ».',chargeExplain:'75 €/mois, soit 900 €/an : bon niveau.'}
];

let profile=readJson('houserProfile',{maxBudget:150000,target:0.065,maxCharges:140,maxChargesM2:35,down:25000,maxEffort:100,safety:6000,dca:500,currentRent:715});
let decisions=readJson('houserDecisions',{});
let view='feed';
let feedMode='priority';
let index=0;
let ranked=[];

function readJson(key,fallback){try{const raw=localStorage.getItem(key);return raw?Object.assign({},fallback,JSON.parse(raw)):fallback}catch(e){return fallback}}
function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
function euro(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number.isFinite(n)?n:0)}
function pct(n){return ((Number.isFinite(n)?n:0)*100).toFixed(1)+' %'}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function help(text){return '<span class="info" tabindex="0">i<span class="tiptext">'+text+'</span></span>'}

function calc(x){
 const ppm=x.price/x.sqm,gross=x.rent*12/x.price,chargesMonthly=x.charges/12,chargesM2=x.charges/x.sqm;
 const yieldPrice=x.rent*12/profile.target,marketPrice=x.market*x.sqm;
 let riskFactor=1;if(x.dpe==='E')riskFactor-=.06;if(x.copro==='unknown')riskFactor-=.03;if(chargesMonthly>profile.maxCharges)riskFactor-=.04;if(chargesMonthly>220)riskFactor-=.08;
 const riskAdjustedMarket=marketPrice*riskFactor-x.works;
 const houserPrice=Math.max(0,Math.round(Math.min(yieldPrice,riskAdjustedMarket)/1000)*1000);
 const discount=1-houserPrice/x.price,nonRecoverable=x.charges*.35,vacancy=x.rent*12*.03,maintenance=x.rent*12*.05;
 const netAnnual=x.rent*12-nonRecoverable-x.tax-vacancy-maintenance-120,netYield=netAnnual/(x.price+x.price*.08+x.works);
 let score=50;score+=clamp((gross-.055)*900,-18,18);score+=clamp((netYield-.035)*700,-12,12);score+=clamp(((x.market-ppm)/x.market)*35,-12,12);
 if(chargesMonthly<=100&&chargesM2<=28)score+=10;else if(chargesMonthly<=profile.maxCharges&&chargesM2<=profile.maxChargesM2)score+=5;else if(chargesMonthly<=220&&chargesM2<=50)score-=8;else score-=20;
 if(['A','B','C'].includes(x.dpe))score+=7;else if(x.dpe==='D')score+=3;else if(x.dpe==='E')score-=8;else score-=25;
 if(x.copro==='clean')score+=4;else if(x.copro==='unknown')score-=3;else score-=20;if(x.price>profile.maxBudget)score-=10;if(discount>.18)score-=8;if(x.mourabaha==='risk')score-=20;
 score=Math.round(clamp(score,0,100));
 let verdict=score>=72?'🟢 MATCH':score>=50?'🟠 À CREUSER':'🔴 PASSER';if(!x.free||['F','G'].includes(x.dpe)||x.copro==='risk'||x.mourabaha==='no')verdict='🔴 PASSER';
 const negotiation=discount<=0.05?'Réaliste':discount<=0.12?'Négociable':'Difficile aujourd’hui';
 const opening=Math.round(houserPrice*(discount<=.05?.985:discount<=.12?.96:.95)/1000)*1000;
 return Object.assign({},x,{ppm,gross,chargesMonthly,chargesM2,yieldPrice,marketPrice,riskAdjustedMarket,houserPrice,discount,netAnnual,netYield,score,verdict,negotiation,opening});
}

function rerank(){ranked=listings.map(calc).sort((a,b)=>b.score-a.score);if(feedMode==='priority')ranked=ranked.filter(x=>x.score>=50&&!x.verdict.includes('PASSER'));const undecided=ranked.filter(x=>!decisions[x.id]);if(undecided.length)ranked=undecided.concat(ranked.filter(x=>decisions[x.id]));if(index>=ranked.length)index=0}
function header(){return '<div class="top"><div class="brand"><div class="logo">⌂</div><div><b style="font-size:24px">Houser</b><div class="muted small">Ton chasseur locatif — strict, pédagogique, patient.</div></div></div><div class="tabs">'+tabButton('criteria','Mes critères')+tabButton('feed','Top matches')+tabButton('short','À creuser')+'</div></div>'}
function tabButton(key,label){return '<button class="btn '+(view===key?'on':'')+'" data-view="'+key+'">'+label+'</button>'}
function field(key,label,value,tip){return '<div class="field"><label>'+label+help(tip)+'</label><input inputmode="decimal" data-profile="'+key+'" value="'+value+'"></div>'}

function criteriaView(){return '<div class="card"><div class="status">✓ Mandat Houser prérempli</div><h2>Ton cahier des charges</h2><p class="muted">Tu n’es pas pressé. Houser doit prouver qu’un bien mérite d’immobiliser ton apport et de réduire ta flexibilité.</p></div><div class="grid g2" style="margin-top:14px">'+
'<section class="card"><h3 class="section-title">1. Filtres éliminatoires</h3>'+rule('🏠','Bien libre uniquement','Aucun bail à reprendre. Tu choisis le locataire, le type de location et le loyer de départ.')+rule('☪️','Compatible Mourabaha','Pas de raisonnement automatique avec un crédit bancaire classique. Les gros travaux pouvant bloquer la Mourabaha sont un risque majeur.')+rule('⚡','DPE F/G exclus','E possible seulement si le prix compense clairement le futur risque travaux. A–D préférés.')+rule('🏢','Copropriété saine','Procédure sérieuse, impayés importants ou gros travaux mal provisionnés = stop ou très forte décote.')+'</section>'+ 
'<section class="card"><h3 class="section-title">2. Économie du deal</h3><div class="grid g2">'+field('maxBudget','Budget affiché max (€)',profile.maxBudget,'Repère de recherche, pas plafond absolu. Au-dessus, le dossier doit être exceptionnel.')+field('target','Rendement brut cible (%)',profile.target*100,'Premier filtre : loyer annuel HC / prix affiché. Cible actuelle 6,5 %, mais la qualité de l’actif compte aussi.')+field('maxCharges','Charges copro cible max (€/mois)',profile.maxCharges,'Houser pénalise les charges élevées car elles réduisent le net et peuvent masquer une copro coûteuse.')+field('maxChargesM2','Charges cible max (€/m²/an)',profile.maxChargesM2,'Permet de comparer équitablement un 30 m² et un 70 m².')+field('maxEffort','Effort mensuel max (€)',profile.maxEffort,'Cash-flow neutre ou positif idéal. Jusqu’à ~100 €/mois seulement pour un actif vraiment qualitatif.')+field('down','Apport cible (€)',profile.down,'Capital que tu es prêt à immobiliser. Houser compare toujours ce choix à l’alternative ETF World Islamic.')+'</div></section>'+ 
'<section class="card"><h3 class="section-title">3. Ta situation personnelle</h3>'+rule('🛟','Épargne de sécurité : '+euro(profile.safety),'Intouchable pour l’achat.')+rule('📈','DCA World Islamic : '+euro(profile.dca)+'/mois','Continue en parallèle : l’immobilier ne doit pas aspirer toute ta capacité d’investissement.')+rule('🏡','Loyer actuel : ~'+euro(profile.currentRent)+'/mois','Ta location actuelle t’achète de la mobilité professionnelle. Un achat doit mériter de perdre une partie de cette flexibilité.')+rule('🇨🇭','Mobilité possible vers la Suisse / hors Strasbourg','Le bien doit fonctionner comme locatif autonome si tu pars dans 6 à 12 mois.')+'</section>'+ 
'<section class="card"><h3 class="section-title">4. Actif recherché</h3>'+rule('📐','T1 bis / T2 / petit T3','Typologies liquides, simples à relouer et généralement faciles à revendre.')+rule('🚋','Transports + commerces + emploi','Houser favorise les secteurs où le locataire peut vivre sans dépendre fortement de la voiture.')+rule('🔁','Horizon 10–20 ans','Question centrale : serais-tu content de garder ce bien longtemps si tu quittes Strasbourg ?')+rule('🧾','Sortie facile','On regarde aussi la profondeur du marché à la revente, pas seulement le rendement du jour.')+'</section></div>'+ 
'<div class="learn" style="margin-top:14px"><b>Principe central</b><br>Un bien “correct” n’est pas suffisant. Si Houser hésite entre acheter et garder les 25 k€ liquides / investis en ETF World Islamic, le bien ne passe pas encore.</div>'}
function rule(icon,title,text){return '<div class="rule"><div>'+icon+'</div><div><strong>'+title+'</strong><span class="muted small">'+text+'</span></div></div>'}

function metric(label,value,tip,klass){return '<div class="metric"><div class="kpi-label">'+label+help(tip)+'</div><b class="'+(klass||'')+'">'+value+'</b></div>'}
function feedView(){
 rerank();
 const allPriority=listings.map(calc).filter(x=>x.score>=50&&!x.verdict.includes('PASSER')).sort((a,b)=>b.score-a.score);
 if(!ranked.length)return '<div class="card empty"><h2>'+ (feedMode==='priority'?'Plus aucun bien prioritaire à traiter':'Aucun bien') +'</h2><p class="muted">'+(feedMode==='priority'?'Tu as parcouru les candidats actuels. Tu peux revoir ta shortlist ou afficher tous les dossiers, y compris les moins bons.':'Houser n’a rien à afficher.')+'</p><div class="actions" style="justify-content:center"><button class="btn" data-feedmode="all">Voir tous les dossiers</button><button class="btn primary" data-view="short">Voir ma shortlist</button></div></div>';
 const x=ranked[index],scoreClass=x.score>=72?'good':x.score>=50?'mid':'bad',decision=decisions[x.id];
 const priorityCount=allPriority.length,processed=allPriority.filter(y=>decisions[y.id]).length;
 return '<div class="line"><div><b>Les meilleurs d’abord</b><div class="count">'+processed+' / '+priorityCount+' priorités déjà traitées</div></div><div class="subtabs"><button class="btn '+(feedMode==='priority'?'on':'')+'" data-feedmode="priority">Prioritaires</button><button class="btn '+(feedMode==='all'?'on':'')+'" data-feedmode="all">Tous</button></div></div><div class="progress"><div style="width:'+(priorityCount?processed/priorityCount*100:0)+'%"></div></div>'+ 
'<article class="listing" style="margin-top:14px"><section class="card '+(decision?'done':'')+'"><div class="title"><div><div class="small muted">'+x.id+' · '+(x.free?'✅ LIBRE':'⚠️ À CONFIRMER')+'</div><h2>'+x.city+' — '+x.area+'</h2><div class="meta"><span class="chip">'+x.type+'</span><span class="chip">'+x.sqm+' m²</span><span class="chip '+(['A','B','C'].includes(x.dpe)?'green':x.dpe==='D'?'orange':'red')+'">DPE '+x.dpe+'</span><span class="chip">'+euro(x.ppm)+'/m²</span></div></div><div><div class="price">'+euro(x.price)+'</div><div class="source">'+x.freeEvidence+'</div></div></div>'+ 
'<div class="grid g4" style="margin-top:16px">'+metric('Score Houser',x.score+'/100','Score de présélection, pas une vérité absolue. Il combine rendement, net d’exploitation, prix/m² vs marché, charges, DPE, copro, budget et risques.',scoreClass)+metric('Loyer prudent',euro(x.rent)+' HC',x.rentExplain)+metric('Rendement brut',pct(x.gross),'Loyer annuel hors charges / prix affiché. Très utile pour filtrer vite, mais il ignore taxe foncière, copro, vacance, entretien et financement.')+metric('Charges copro',euro(x.chargesMonthly)+'/mois','Houser regarde à la fois €/mois et €/m²/an. '+x.chargeExplain)+'</div>'+ 
'<div class="grid g3" style="margin-top:14px">'+metric('Net exploitation',pct(x.netYield),'Estimation après part non récupérable des charges (35 % par défaut), taxe foncière, 3 % de vacance, 5 % d’entretien et 120 €/an de PNO. Avant Mourabaha et fiscalité.')+metric('Prix/m² vs marché',euro(x.ppm)+' vs '+euro(x.market),x.marketExplain)+metric('Houser Price™',euro(x.houserPrice),'Prix maximum de départ calculé comme le plus prudent entre 1) prix compatible avec ton rendement cible et 2) valeur de marché ajustée des risques/charges/travaux. Arrondi au millier.')+'</div>'+ 
'<h3>'+x.verdict+'</h3><p>'+x.notes.map(n=>'✓ '+n).join(' · ')+'</p>'+ (decision?'<div class="status '+(decision==='deep'?'':'warn')+'">Décision enregistrée : '+(decision==='deep'?'★ À creuser':'✕ Passé')+'</div>':'<div class="actions"><button class="btn" data-action="pass">✕ Passer</button><button class="btn soft" data-action="next">Suivant →</button><button class="btn primary" data-action="deep">★ Creuser</button></div>')+'</section>'+ 
'<aside><div class="why"><b>Pourquoi '+euro(x.houserPrice)+' ? '+help('Houser ne “devine” pas une remise. Il croise rendement cible et valeur locale, puis pénalise DPE, copro, charges et travaux.')+'</b><div class="line"><span>Prix compatible rendement</span><b>'+euro(x.yieldPrice)+'</b></div><div class="line"><span>Valeur marché estimée</span><b>'+euro(x.marketPrice)+'</b></div><div class="line"><span>Marché ajusté risques</span><b>'+euro(x.riskAdjustedMarket)+'</b></div><div class="source">'+x.marketExplain+'</div></div>'+ 
'<div class="nego" style="margin-top:12px"><b>Plan pour l’avoir</b><h3>'+x.negotiation+'</h3><div class="line"><span>Offre d’ouverture</span><b>'+euro(x.opening)+'</b></div><div class="line"><span>Cible d’atterrissage</span><b>'+euro(x.houserPrice)+'</b></div><div class="small">Écart vendeur → cible : '+(x.discount*100).toFixed(1)+' %. Si l’écart est trop grand, la bonne stratégie peut être d’attendre une baisse plutôt que faire une offre irréaliste.</div></div>'+ 
'<div class="learn" style="margin-top:12px"><b>Quand tu cliques “Creuser”</b><div class="small" style="margin-top:5px">Houser doit passer au niveau 2 : loyer comparable précis, PV d’AG, travaux votés, part de charges récupérables, taxe foncière réelle, scénario Mourabaha, offre d’ouverture et arguments de négociation.</div></div><a class="btn" style="display:block;text-align:center;margin-top:12px;text-decoration:none" href="'+x.source+'" target="_blank" rel="noopener">Voir l’annonce source ↗</a></aside></article>'
}

function shortlistView(){const items=listings.map(calc).filter(x=>decisions[x.id]==='deep').sort((a,b)=>b.score-a.score);return '<div class="card"><div class="line"><div><h2 style="margin:0">À creuser</h2><div class="muted small">Les biens pour lesquels on passe à l’analyse approfondie.</div></div><button class="btn" data-action="back-feed">Retour au feed</button></div>'+(items.length?items.map(x=>'<div class="short"><span><b>'+x.city+' — '+x.area+'</b><br><span class="muted small">'+x.score+'/100 · '+pct(x.gross)+' brut · charges '+euro(x.chargesMonthly)+'/mois</span></span><span style="text-align:right"><b>'+euro(x.price)+'</b><br><span class="small">Houser Price '+euro(x.houserPrice)+'</span></span></div>').join(''):'<div class="empty muted">Aucun bien sélectionné pour le moment.</div>')+'</div>'}

function render(){rerank();document.querySelector('#app').innerHTML='<main class="app">'+header()+(view==='criteria'?criteriaView():view==='short'?shortlistView():feedView())+'</main>';bind()}
function bind(){
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;index=0;render()});
 document.querySelectorAll('[data-feedmode]').forEach(b=>b.onclick=()=>{feedMode=b.dataset.feedmode;index=0;render()});
 document.querySelectorAll('[data-profile]').forEach(i=>i.onchange=()=>{const k=i.dataset.profile,v=Number(String(i.value).replace(',','.'));profile[k]=k==='target'?v/100:v;writeJson('houserProfile',profile);index=0;render()});
 document.querySelector('[data-action="next"]')?.addEventListener('click',()=>{index=(index+1)%ranked.length;render()});
 document.querySelector('[data-action="pass"]')?.addEventListener('click',()=>{const id=ranked[index].id;decisions[id]='pass';writeJson('houserDecisions',decisions);index=0;render()});
 document.querySelector('[data-action="deep"]')?.addEventListener('click',()=>{const id=ranked[index].id;decisions[id]='deep';writeJson('houserDecisions',decisions);index=0;render()});
 document.querySelector('[data-action="back-feed"]')?.addEventListener('click',()=>{view='feed';index=0;render()});
}
try{render()}catch(err){document.querySelector('#app').innerHTML='<div class="error"><b>Houser a rencontré une erreur.</b><pre style="white-space:pre-wrap">'+String(err&&err.stack||err)+'</pre></div>';console.error(err)}
})();
</script>
</body>
</html>
